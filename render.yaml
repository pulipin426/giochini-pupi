services:
  - type: web
    name: giochini-pupi
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: FOOTBALL_DATA_COMPETITION
        value: SA
      - key: FOOTBALL_DATA_SEASON
        value: "2026"
      - key: FOOTBALL_DATA_SYNC_INTERVAL_MS
        value: "900000"
      - key: ADMIN_TOKEN
        sync: false
      - key: FOOTBALL_DATA_TOKEN
        sync: false
    disk:
      name: giochini-pupi-data
      mountPath: /var/data
      sizeGB: 1
